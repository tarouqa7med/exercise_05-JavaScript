<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/FontAwesome/all.min.css">
        <link rel="stylesheet" href="./css/bootstrap/bootstrap.css">
        <link rel="stylesheet" href="./css/main.css">
        <link rel="icon" href="./images/logo.png">
        <title>Document</title>
</head>
<body>
        
        <section class="register" id="register">
                <div class="container">
                        <div class="logo text-center my-5">
                                <img src="./images/logo.png" alt="">
                        </div>
                        <div class="body text-center">
                                <form action="" class="w-50 m-auto p-4 my-5">
                                        <h2 class="fs-4">Students System</h2>
                                        <div class="input-group mb-3">
                                                <span class="input-group-text">
                                                        <i class="fa-solid fa-user"></i>
                                                </span>
                                                <input type="text" class="form-control" name="firstName" id="firstName" placeholder="First Name *" onblur="inputCheck(this)">
                                        </div>
                                        <div class="alert alert-danger d-none" data-error="firstName" role="alert">
                                        </div>
                                        <div class="input-group mb-3">
                                                <span class="input-group-text">
                                                        <i class="fa-solid fa-user"></i>
                                                </span>
                                                <input type="text" class="form-control" name="lastName" id="lastName" placeholder="Last Name *" onblur="inputCheck(this)">
                                        </div>
                                        <div class="alert alert-danger d-none" data-error="lastName" role="alert">
                                        </div>
                                        <div class="input-group mb-3">
                                                <span class="input-group-text">
                                                        <i class="fa-solid fa-envelope"></i>
                                                </span>
                                                <input type="text" class="form-control" name="email" id="email" placeholder="Email *" onblur="inputCheck(this)">
                                        </div>
                                        <div class="alert alert-danger d-none" data-error="email" role="alert">
                                        </div>
                                        <div class="input-group mb-3">
                                                <span class="input-group-text">
                                                        <i class="fa-solid fa-hashtag"></i>
                                                </span>
                                                <input type="text" class="form-control" name="age" id="age" placeholder="Age *" onblur="inputCheck(this)">
                                        </div>
                                        <div class="alert alert-danger d-none" data-error="age" role="alert">
                                        </div>
                                        <div class="input-group mb-3">
                                                <span class="input-group-text">
                                                        <i class="fa-solid fa-mobile"></i>
                                                </span>
                                                <input type="text" class="form-control" name="mobile" id="mobile" placeholder="Mobile *" value="+20 " onblur="inputCheck(this)">
                                        </div>
                                        <div class="alert alert-danger d-none" data-error="mobile" role="alert">
                                        </div>
                                        <div class="input-group">
                                                <button class="btn btn-success w-100">Add</button>
                                        </div>
                                </form>
                        </div>
                </div>
        </section>

        <section class="search" id="search">
                <div class="input-group w-25 m-auto" style="min-width: 200px;">
                        <span class="input-group-text">
                                <i class="fa-solid fa-search" style="color: var(--mainColor);"></i>
                        </span>
                        <input type="text" class="form-control" name="search" id="search" placeholder="Search...">
                </div>
        </section>
        
        <section id="insertedData" class="insertedData">
                <div class="container py-4 my-5">
                        <!-- <div class="alert alert-warning text-center" data-error="mobile" role="alert">
                                There are no data
                        </div> -->
                        <div class="table-responsive m-auto rounded-3">
                                <table class="table table-striped table-hover m-auto">
                                        <thead class="table-dark">
                                                <tr>
                                                        <th scope="col">#</th>
                                                        <th scope="col">First Name</th>
                                                        <th scope="col">Last Name</th>
                                                        <th scope="col">Email</th>
                                                        <th scope="col">Age</th>
                                                        <th scope="col">Phone</th>
                                                        <th scope="col">Option</th>
                                                </tr>
                                        </thead>
                                        <tbody>

                                        </tbody>
                                </table>
                        </div>
                </div>
        </section>

        <script src="./js/bootstrap.js"></script>
        <script src="./js/functions.js"></script>
        <script src="./js/main.js"></script>
</body>
</html>
